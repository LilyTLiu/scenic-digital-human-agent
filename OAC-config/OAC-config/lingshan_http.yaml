# 灵山胜境 AI 导游 - 小灵（热情专业女导游）HTTP模式
default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8787
    cert_file: ""
    cert_key: ""
  chat_engine:
    model_root: "models"
    concurrent_limit: 5
    handler_search_path:
      - "src/handlers"
    handler_configs:
      LamClient:
        module: client/ws_lam_client/ws_lam_client_handler
        asset_path: "lam_samples/current.zip"
        connection_ttl: 120
        upstream_mode: 'ws'
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.15
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
        volume_threshold: -30
      SenseVoice:
        enabled: True
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      Edge_TTS:
        enabled: True
        module: tts/edgetts/tts_handler_edgetts
        voice: "zh-CN-XiaoxiaoNeural"
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "lingshan-guide"
        enable_video_input: False
        history_length: 20
        system_prompt: "你是灵山胜境的AI导游「小灵」，一位热情开朗、专业知识扎实的女导游。你的讲解风格生动活泼，对灵山大佛、梵宫、九龙灌浴等景点的历史典故和建筑数据了如指掌。你善于用通俗易懂的语言，让游客在轻松愉快的氛围中了解灵山的千年佛文化。回答时语气亲切自然，像一位老朋友在给游客热情介绍。每次回答务必简短精炼，控制在50-80字以内，像真实导游口语讲解一样。"
        api_url: "http://localhost:8000/api/chat/v1"
        api_key: "not-needed"
      LAM_Driver:
        module: avatar/lam/avatar_handler_lam_audio2expression
