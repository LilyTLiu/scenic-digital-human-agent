# ══════════════════════════════════════════════════════════════
# 灵山胜境数字人导游 — 生产部署编排（自包含于 deploy/ 文件夹）
#
# 用法（在仓库根目录）:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
# 或直接: bash deploy/deploy.sh
#
# 说明:
#   build.context  指向源码目录（backend/ frontend/）
#   build.dockerfile 指向 deploy/ 内的 Dockerfile（本文件夹自包含）
#   frontend 的 nginx.conf 用 volume 挂载，改配置无需重建镜像
# ══════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend/Dockerfile
    container_name: lingshan-backend
    environment:
      - DATA_DIR=/app/data
      # 以下变量从 deploy/.env 读取（--env-file deploy/.env）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - TTS_VOICE=${TTS_VOICE:-zh-CN-XiaoxiaoNeural}
    volumes:
      # 持久化数据（SQLite + ChromaDB），重启/重建不丢失
      - lingshan_data:/app/data
      # 知识库 Word 源文件（导入知识库用）
      - ../示范景区公开资料包:/示范景区公开资料包:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend/Dockerfile
    container_name: lingshan-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx 配置（volume 挂载，改配置无需重建镜像）
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书（deploy/deploy.sh 自动生成）
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lingshan_data:
