version: "3.8"

services:
  backend:
    build: ./backend
    container_name: lingshan-backend
    environment:
      - DATA_DIR=/app/data
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - TTS_VOICE=${TTS_VOICE:-zh-CN-XiaoxiaoNeural}
    volumes:
      # 持久化数据（SQLite + ChromaDB），重启/重建不丢失
      - lingshan_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_XMOV_APP_ID=${VITE_XMOV_APP_ID:-}
        - VITE_XMOV_APP_SECRET=${VITE_XMOV_APP_SECRET:-}
        - VITE_XMOV_AVATAR_2_ID=${VITE_XMOV_AVATAR_2_ID:-}
        - VITE_XMOV_AVATAR_2_SECRET=${VITE_XMOV_AVATAR_2_SECRET:-}
        - VITE_XMOV_AVATAR_3_ID=${VITE_XMOV_AVATAR_3_ID:-}
        - VITE_XMOV_AVATAR_3_SECRET=${VITE_XMOV_AVATAR_3_SECRET:-}
        - VITE_XMOV_SDK_URL=${VITE_XMOV_SDK_URL:-https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js}
        - VITE_XMOV_GATEWAY_SERVER=${VITE_XMOV_GATEWAY_SERVER:-https://nebula-agent.xingyun3d.com/user/v1/ttsa/session}
        - VITE_AMAP_KEY=${VITE_AMAP_KEY:-}
        - VITE_AMAP_SECRET=${VITE_AMAP_SECRET:-}
    container_name: lingshan-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lingshan_data:
