# ══════════════════════════════════════════════════════════════
# 灵山胜境数字人导游 — 生产部署编排
# 使用: docker compose up -d
# 前置: deploy/.env（后端变量）+ frontend/.env（Vite 构建变量）+ certs/（HTTPS 证书）
# 详见 deploy/README.md
# ══════════════════════════════════════════════════════════════

services:
  backend:
    build: ./backend
    container_name: lingshan-backend
    environment:
      - DATA_DIR=/app/data
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - TTS_VOICE=${TTS_VOICE:-zh-CN-XiaoxiaoNeural}
    volumes:
      # 持久化数据（SQLite + ChromaDB），重启/重建不丢失
      - lingshan_data:/app/data
      # 知识库 Word 源文件（导入知识库用）
      - ./示范景区公开资料包:/示范景区公开资料包:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: lingshan-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTPS 证书（生成方式见 deploy/README.md）
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lingshan_data:
